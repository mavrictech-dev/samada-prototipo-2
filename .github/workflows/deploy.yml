name: Continuous Deployment - Contabo VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Despliegue automático en VPS
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue vía SSH en Contabo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "Iniciando despliegue de Samada Commerce..."
            cd /var/www/samada
            git pull origin main
            ./deploy.sh
