name: Continuous Deployment - Contabo VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Despliegue automático en VPS
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue vía SSH en Contabo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.60.234.60
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "=========================================="
            echo "Iniciando despliegue de Samada Commerce..."
            echo "=========================================="
            cd /var/www/samada
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy.sh
            ./deploy.sh
