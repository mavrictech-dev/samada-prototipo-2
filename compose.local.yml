services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: samada
      POSTGRES_USER: samada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["samada_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samada -d samada"]
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:2526:1025", "127.0.0.1:8026:8025"]
volumes:
  samada_pg:
